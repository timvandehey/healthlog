<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter - Juris Framework</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app"></div>
    
    <script src="https://unpkg.com/juris"></script>
    <script type="module" src="counter.js"></script>
    <script type="module">
        import {Counter} from './counter.js';
        // Initialize Juris app
        const juris = new Juris({
            components: {
                Counter
            },
            
            layout: {
                div: {
                    children: [{ Counter: {} }]
                }
            },
            
            // states: {
            //     count: 0
            // }
        });

        // Render the app
        juris.render('#app');

        // Global access for debugging
        window.juris = juris;

        console.log('🎯 Simple Counter Ready!');
        console.log('💡 Try: juris.setState("count", 42)');
        console.log('📊 Current state:', juris.getState('count'));
    </script>
</body>
</html>
