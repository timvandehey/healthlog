<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juris App - Login & Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app"></div>
    
    <script src="https://unpkg.com/juris"></script>
    <script type="module">
        import { Login } from './login.js';
        import { Counter } from './counter.js';
        import { Header } from './header.js';

        // Initialize Juris app
        const juris = new Juris({
            components: {
                Login,
                Counter,
                Header
            },
            
            layout: {
                div: {
                    children: [
                        { Header: {} }, // Always show the header
                        {
                            // Main content area that will switch between Login and Counter
                            div: {
                                className: 'main-content',
                                children: () => {
                                    if (juris.getState('isLoggedIn')) {
                                        return [{ Counter: {} }]; // Show Counter if logged in
                                    } else {
                                        return [{ Login: {} }]; // Show Login otherwise
                                    }
                                }
                            }
                        }
                    ]
                }
            },
            
            // Initial state for the entire application
            states: {
                email: '',
                password: '',
                isLoggedIn: false, // Controls which view is shown
                count: 0, // Initial state for the Counter component
                theme: 'light' // Add theme to the global state
            }
        });

        // --- Theme Initialization ---
        // Check localStorage for a saved theme and apply it on load
        const savedTheme = localStorage.getItem('theme') || 'light';
        juris.setState('theme', savedTheme);
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Render the app
        juris.render('#app');

        // Global access for debugging
        window.juris = juris;

        console.log(`🎯 App Ready! Theme set to: ${savedTheme}. Please log in.`);
        console.log('📊 Current state:', juris.getState());
    </script>
</body>
</html>
